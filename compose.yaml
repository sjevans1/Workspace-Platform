name: openjm-workspace
x-app: &app
  build: .
  image: openjm-workspace:local
  environment: &runtime
    DATABASE_URL: postgres://workspace_runtime:${RUNTIME_DB_PASSWORD:?Generate .env}@postgres:5432/workspace
    REDIS_URL: redis://valkey:6379
    ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Generate .env}
    SETUP_TOKEN: ${SETUP_TOKEN:?Generate .env}
    APP_URL: ${APP_URL:-http://localhost:8080}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    PRODUCT_NAME: ${PRODUCT_NAME:-OpenJM Workspace}
    PRIMARY_ACCENT: ${PRIMARY_ACCENT:-#177a64}
    LOGO_LIGHT: ${LOGO_LIGHT:-}
    LOGO_DARK: ${LOGO_DARK:-}
    FAVICON: ${FAVICON:-}
    LOGIN_BACKGROUND: ${LOGIN_BACKGROUND:-}
    SUPPORT_NAME: ${SUPPORT_NAME:-Workspace support}
    SUPPORT_URL: ${SUPPORT_URL:-}
    LEGAL_NAME: ${LEGAL_NAME:-}
    PRIVACY_URL: ${PRIVACY_URL:-}
    TERMS_URL: ${TERMS_URL:-}
    STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
    # Existing upgrades without this setting retain legacy-read until maintenance migration is completed.
    STORAGE_ENCRYPTION_MODE: ${STORAGE_ENCRYPTION_MODE:-legacy-read}
    STORAGE_LOCAL_PATH: /data/files
    S3_ENDPOINT: ${S3_ENDPOINT:-}
    S3_REGION: ${S3_REGION:-us-east-1}
    S3_BUCKET: ${S3_BUCKET:-workspace}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    WEBHOOK_ALLOWED_ORIGINS: ${WEBHOOK_ALLOWED_ORIGINS:-}
  restart: unless-stopped
  init: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
services:
  postgres:
    image: ghcr.io/sjevans1/workspace-ci-mirror-postgres@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_DB: workspace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env}
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d workspace]
      interval: 5s
      retries: 20
    restart: unless-stopped
  clamav:
    build:
      context: .
      dockerfile: Dockerfile.clamav
    image: openjm-workspace-clamav:local
    environment:
      CLAMD_CONF_StreamMaxLength: 30M
      CLAMAV_NO_MILTERD: "true"
    volumes: [clamav_db:/var/lib/clamav]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
  valkey:
    image: ghcr.io/valkey-io/valkey:8.1.10-alpine
    command: [valkey-server, --save, "", --appendonly, "no"]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *app
    restart: "no"
    command: [node, --import, tsx, packages/database/migrate.ts]
    environment:
      MIGRATION_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/workspace
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
  api:
    <<: *app
    command: [node, --import, tsx, apps/api/src/main.ts]
    volumes: [files:/data/files]
    environment:
      <<: *runtime
      # Only Caddy's sanitized immediate hop is trusted (never unrestricted).
      TRUST_PROXY: "1"
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_TOKEN_ENDPOINT_AUTH_METHOD: ${OIDC_TOKEN_ENDPOINT_AUTH_METHOD:-}
      OIDC_LABEL: ${OIDC_LABEL:-Single sign-on}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      OIDC_REQUIRE_VERIFIED_EMAIL: ${OIDC_REQUIRE_VERIFIED_EMAIL:-true}
      OIDC_ALLOW_INSECURE: ${OIDC_ALLOW_INSECURE:-false}
      OIDC_TENANT_ISSUER_ORIGINS: ${OIDC_TENANT_ISSUER_ORIGINS:-}
      LOCAL_AUTH_ENABLED: ${LOCAL_AUTH_ENABLED:-true}
      ALLOW_SELF_SERVICE_ORGANISATIONS: ${ALLOW_SELF_SERVICE_ORGANISATIONS:-false}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
      METRICS_COLLAB_HEALTH_URL: http://collab:1235/health
      METRICS_WORKER_HEALTH_URL: http://worker:4001/health
      ANTIVIRUS_MODE: ${ANTIVIRUS_MODE:-required}
      ANTIVIRUS_HOST: ${ANTIVIRUS_HOST:-clamav}
      ANTIVIRUS_PORT: ${ANTIVIRUS_PORT:-3310}
      ANTIVIRUS_TIMEOUT_MS: ${ANTIVIRUS_TIMEOUT_MS:-30000}
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
      clamav: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
  collab:
    <<: *app
    command: [node, --import, tsx, apps/collab/src/main.ts]
    environment:
      <<: *runtime
      COLLAB_HEALTH_PORT: "1235"
      COLLAB_HEALTH_HOST: "0.0.0.0"
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:1235/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
  worker:
    <<: *app
    command: [node, --import, tsx, apps/worker/src/main.ts]
    volumes: [files:/data/files]
    environment:
      <<: *runtime
      WORKER_HEALTH_PORT: "4001"
      WORKER_HEALTH_HOST: "0.0.0.0"
      WORKER_HEALTH_MAX_TICK_MS: ${WORKER_HEALTH_MAX_TICK_MS:-60000}
      WORKER_HEALTH_GRACE_MS: ${WORKER_HEALTH_GRACE_MS:-10000}
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 12s
  web:
    <<: *app
    command: [node, node_modules/next/dist/bin/next, start, apps/web, --hostname, 0.0.0.0]
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on:
      api: { condition: service_healthy }
  caddy:
    image: ghcr.io/sjevans1/workspace-ci-mirror-caddy@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    environment:
      CADDY_ADDRESS: ${CADDY_ADDRESS:-:80}
      CADDY_TLS_DIRECTIVE: ${CADDY_TLS_DIRECTIVE:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      [
        "./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro",
        "caddy_data:/data",
        "caddy_config:/config",
      ]
    depends_on:
      web: { condition: service_started }
      collab: { condition: service_healthy }
    restart: unless-stopped
  ops:
    <<: *app
    profiles: [ops]
    restart: "no"
    environment:
      <<: *runtime
      MIGRATION_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/workspace
      WORKSPACE_MAINTENANCE: "true"
    volumes: [files:/data/files, "./backups:/backups"]
    depends_on:
      postgres: { condition: service_healthy }
volumes:
  postgres:
  files:
  clamav_db:
  caddy_data:
  caddy_config:

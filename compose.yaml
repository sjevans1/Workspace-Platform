name: openjm-workspace
x-app: &app
  build: .
  image: openjm-workspace:local
  environment: &runtime
    DATABASE_URL: postgres://workspace_runtime:${RUNTIME_DB_PASSWORD:?Generate .env}@postgres:5432/workspace
    REDIS_URL: redis://valkey:6379
    ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Generate .env}
    SETUP_TOKEN: ${SETUP_TOKEN:?Generate .env}
    APP_URL: ${APP_URL:-http://localhost:8080}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    PRODUCT_NAME: ${PRODUCT_NAME:-OpenJM Workspace}
    PRIMARY_ACCENT: ${PRIMARY_ACCENT:-#177a64}
    LOGO_LIGHT: ${LOGO_LIGHT:-}
    LOGO_DARK: ${LOGO_DARK:-}
    FAVICON: ${FAVICON:-}
    LOGIN_BACKGROUND: ${LOGIN_BACKGROUND:-}
    SUPPORT_NAME: ${SUPPORT_NAME:-Workspace support}
    SUPPORT_URL: ${SUPPORT_URL:-}
    LEGAL_NAME: ${LEGAL_NAME:-}
    PRIVACY_URL: ${PRIVACY_URL:-}
    TERMS_URL: ${TERMS_URL:-}
    STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
    STORAGE_LOCAL_PATH: /data/files
    S3_ENDPOINT: ${S3_ENDPOINT:-}
    S3_REGION: ${S3_REGION:-us-east-1}
    S3_BUCKET: ${S3_BUCKET:-workspace}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    WEBHOOK_ALLOWED_ORIGINS: ${WEBHOOK_ALLOWED_ORIGINS:-}
  restart: unless-stopped
  init: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: workspace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env}
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d workspace]
      interval: 5s
      retries: 20
    restart: unless-stopped
  valkey:
    image: ghcr.io/valkey-io/valkey:8.1.10-alpine
    command: [valkey-server, --save, "", --appendonly, "no"]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *app
    restart: "no"
    command: [npm, run, migrate]
    environment:
      MIGRATION_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/workspace
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
  api:
    <<: *app
    command: [npm, run, "start:api"]
    volumes: [files:/data/files]
    environment:
      <<: *runtime
      TRUST_PROXY: "true"
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
  collab:
    <<: *app
    command: [npm, run, "start:collab"]
    depends_on:
      migrate: { condition: service_completed_successfully }
  worker:
    <<: *app
    command: [npm, run, "start:worker"]
    volumes: [files:/data/files]
    depends_on:
      migrate: { condition: service_completed_successfully }
  web:
    <<: *app
    command: [npm, run, start, -w, apps/web]
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on:
      api: { condition: service_healthy }
  caddy:
    image: caddy:2.11.4-alpine
    environment:
      CADDY_ADDRESS: ${CADDY_ADDRESS:-:80}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      [
        "./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro",
        "caddy_data:/data",
        "caddy_config:/config",
      ]
    depends_on: [web, collab]
    restart: unless-stopped
  ops:
    <<: *app
    profiles: [ops]
    restart: "no"
    environment:
      <<: *runtime
      MIGRATION_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/workspace
      WORKSPACE_MAINTENANCE: "true"
    volumes: [files:/data/files, "./backups:/backups"]
    depends_on:
      postgres: { condition: service_healthy }
volumes:
  postgres:
  files:
  caddy_data:
  caddy_config:

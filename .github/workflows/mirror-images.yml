name: Mirror upstream images to GHCR

# CI-H1: populate and refresh repository-controlled GHCR mirrors of the approved
# upstream Docker Hub images, so normal Workspace CI never depends on
# unauthenticated Docker Hub pulls.
#
# The scheduled run only CHECKS for upstream drift and reports it; it never
# promotes. Promoting a new upstream digest is a reviewed change to
# ci/ghcr-mirror-manifest.json followed by full acceptance.
on:
  # Temporary: lets this branch populate GHCR before the workflow exists on the
  # default branch. Removed before merge; the final workflow keeps only
  # workflow_dispatch and the weekly verify schedule.
  push:
    branches: [feature/ci-h1-ghcr-mirror]
  workflow_dispatch:
    inputs:
      refresh:
        description: "Copy upstream images into GHCR and record mirror digests"
        type: boolean
        default: false
  schedule:
    # Low-frequency drift check (Mondays 06:17 UTC). Verify only.
    - cron: "17 6 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install skopeo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo
      - name: Authenticate to GHCR
        run: |
          # GITHUB_TOKEN only. Never printed, never committed.
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Verify upstream digests (and mirror when refreshed)
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          mode="--verify"
          if [ "${{ github.event_name }}" = "push" ]; then
            mode="--mirror"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.refresh }}" = "true" ]; then
            mode="--mirror"
          fi
          node scripts/ci/ghcr-mirror.mjs "$mode" --report mirror-report.json
      - name: Publish mirror packages (best effort, for anonymous CI pulls)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The backend job starts postgres/seaweedfs as GitHub Actions service
          # containers, which pull BEFORE any step can authenticate. Those
          # mirrors therefore need to be publicly pullable. This is best effort:
          # if the token cannot change visibility, the CI jobs additionally log
          # in to GHCR before every non-service pull.
          for pkg in node postgres clamav caddy seaweedfs; do
            gh api --method PATCH "/user/packages/container/workspace-ci-mirror-${pkg}" \
              -f visibility=public >/dev/null 2>&1 \
              && echo "public: workspace-ci-mirror-${pkg}" \
              || echo "could not set visibility for workspace-ci-mirror-${pkg} (continuing)"
          done
      - name: Upload mirror report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ghcr-mirror-report
          path: mirror-report.json
          if-no-files-found: warn
      - name: Show manifest diff when refreshed
        if: github.event_name == 'workflow_dispatch' && inputs.refresh == true
        run: |
          # The refreshed manifest carries the recorded mirror digests. Commit it
          # only after review; this workflow never pushes to the repository.
          git --no-pager diff --stat -- ci/ghcr-mirror-manifest.json || true
          git --no-pager diff -- ci/ghcr-mirror-manifest.json || true

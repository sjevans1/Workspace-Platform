name: Workspace verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: "Regenerate visual baselines and upload them as an artifact (never auto-committed)"
        type: boolean
        default: false
concurrency:
  group: workspace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      # CI-H1: service images come from the repository-controlled GHCR mirrors
      # pinned by immutable digest, so normal CI never performs anonymous Docker
      # Hub pulls. Provenance: ci/ghcr-mirror-manifest.json.
      seaweedfs:
        image: ghcr.io/sjevans1/workspace-ci-mirror-seaweedfs@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
        env:
          AWS_ACCESS_KEY_ID: workspace-ci
          AWS_SECRET_ACCESS_KEY: workspace-ci-secret
          S3_BUCKET: workspace-ci
        ports: ["8333:8333"]
      postgres:
        image: ghcr.io/sjevans1/workspace-ci-mirror-postgres@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          POSTGRES_DB: workspace
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:test-only-password@localhost:5432/workspace
      TEST_S3_ENDPOINT: http://127.0.0.1:8333
      TEST_S3_ACCESS_KEY: workspace-ci
      TEST_S3_SECRET_KEY: workspace-ci-secret
      NEXT_TELEMETRY_DISABLED: "1"
      TEST_SHUTDOWN_DIAGNOSTICS: "true"
      PGOPTIONS: "-c statement_timeout=30000 -c lock_timeout=10000"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # W09e adds a 10k-row durable export qualification (two full exports plus
      # reclaim/cancel/expiry scenarios) to the native suite. This raises only
      # the wall-clock budget for this step; no product or security limit
      # changes and no test is skipped.
      - run: npm test
        timeout-minutes: 8
      - name: Verify CI consumes only mirrored dependencies (CI-H1)
        run: |
          # Runtime/acceptance definitions must reference the digest-pinned GHCR
          # mirrors, never the upstream Docker Hub images. Only FROM/image lines
          # are inspected, so provenance comments are unaffected.
          if grep -nE '^[[:space:]]*(FROM[[:space:]]+|image:[[:space:]]*)(docker\.io/)?(library/)?(node:24-trixie-slim|postgres:17\.11-bookworm|clamav/clamav:1\.5\.4-debian13-slim|caddy:2\.11\.4-alpine|chrislusf/seaweedfs:4\.47)' \
              Dockerfile Dockerfile.clamav compose.yaml .github/workflows/ci.yml; then
            echo "CI-H1: a consumed definition still references an upstream Docker Hub image" >&2
            exit 1
          fi
          # The Docker Hub credentials are for the mirror workflow only. Match the
          # secret expression, not the bare word (this guard's own text must not
          # count as evidence).
          if grep -nE 'secrets\.DOCKERHUB' .github/workflows/ci.yml; then
            echo "CI-H1: normal CI must not use Docker Hub credentials" >&2
            exit 1
          fi
          echo "CI-H1: only digest-pinned GHCR mirrors are consumed; no Docker Hub credentials in normal CI"
      - name: Verify CI event orchestrator
        run: npm run test:ci-orchestrator
      - name: Verify production S3 acceptance harness
        run: |
          node --input-type=module <<'NODE'
          import { S3Client, CreateBucketCommand } from "@aws-sdk/client-s3";
          const client = new S3Client({
            endpoint: "http://127.0.0.1:8333",
            region: "us-east-1",
            forcePathStyle: true,
            credentials: {
              accessKeyId: "workspace-ci",
              secretAccessKey: "workspace-ci-secret",
            },
          });
          for (const Bucket of ["openjm-acceptance-source", "openjm-acceptance-recovery"]) {
            try {
              await client.send(new CreateBucketCommand({ Bucket }));
            } catch (error) {
              if (error?.name !== "BucketAlreadyOwnedByYou") throw error;
            }
          }
          client.destroy();
          NODE
          S3_ACCEPT_PROVIDER_LABEL=SeaweedFS-CI \
          S3_ACCEPT_ENDPOINT=http://127.0.0.1:8333 \
          S3_ACCEPT_ACCESS_KEY=workspace-ci \
          S3_ACCEPT_SECRET_KEY=workspace-ci-secret \
          S3_ACCEPT_SOURCE_BUCKET=openjm-acceptance-source \
          S3_ACCEPT_RECOVERY_BUCKET=openjm-acceptance-recovery \
          S3_ACCEPT_ALLOW_INSECURE=true \
          S3_ACCEPT_WRITE_CONFIRMATION=I_UNDERSTAND_THIS_WRITES_TEST_OBJECTS \
          npm run accept:s3
      - run: npm run build
  deployment:
    runs-on: ubuntu-latest
    # The deployed acceptance job now hosts the whole-stack W24 qualification in
    # addition to deployment, the browser workflow, the Wave R harness, the
    # W24-R collaboration capacity run, the isolated restore drill, the
    # malware/storage checks, accessibility across three engines and three
    # viewports, the Wave X X0 engine/viewport harness, the X2 visual regression
    # check and trusted TLS, which together exceed the previous allowance on a
    # hosted runner. This raises only the CI wall-clock budget; no product or
    # security limit changes.
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Validate deployment configuration
        run: |
          node scripts/init-env.mjs
          # Test-only metadata: registration never performs discovery/network I/O.
          sed -i 's|^OIDC_TENANT_ISSUER_ORIGINS=.*|OIDC_TENANT_ISSUER_ORIGINS=https://login.example.test|' .env
          grep -Fx 'OIDC_TENANT_ISSUER_ORIGINS=https://login.example.test' .env
          # Disposable rotation acceptance stores a subscription for an event
          # that is never emitted, so no outbound request reaches this origin.
          sed -i 's|^WEBHOOK_ALLOWED_ORIGINS=.*|WEBHOOK_ALLOWED_ORIGINS=https://events.example.test|' .env
          docker compose config --quiet
      - name: Build release containers
        run: docker compose build api clamav
      - name: Verify production-only runtime image
        run: |
          docker run --rm --entrypoint sh openjm-workspace:local -lc '
            test ! -e /app/node_modules/typescript
            test ! -e /app/node_modules/@playwright
            test ! -e /usr/local/lib/node_modules/npm
            ! command -v npm
            ! command -v npx
          '
      - name: Verify shipped source-map-js carries the CVE-2026-93749 fix
        run: |
          docker run --rm --entrypoint node openjm-workspace:local -e '
            const v = require("/app/node_modules/source-map-js/package.json").version;
            const [major, minor, patch] = v.split(".").map(Number);
            const fixed = major > 1 || (major === 1 && (minor > 2 || (minor === 2 && patch >= 2)));
            if (!fixed) {
              console.error(`FAIL: shipped source-map-js ${v} is below the 1.2.2 fix`);
              process.exit(1);
            }
            console.log(`PASS: shipped source-map-js is ${v}`);
          '
      - name: Generate container SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: openjm-workspace:local
          format: cyclonedx-json
          output-file: openjm-workspace-container-sbom.cdx.json
          artifact-name: openjm-workspace-container-sbom
          upload-artifact: true
      - name: Scan release image for fixable high/critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: openjm-workspace:local
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Generate ClamAV runtime SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: openjm-workspace-clamav:local
          format: cyclonedx-json
          output-file: openjm-workspace-clamav-sbom.cdx.json
          artifact-name: openjm-workspace-clamav-sbom
          upload-artifact: true
      - name: Scan ClamAV runtime image for fixable high/critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: openjm-workspace-clamav:local
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Start deployment
        run: |
          docker compose up -d
          for i in $(seq 1 120); do
            all_healthy=1
            for service in api collab worker clamav; do
              id="$(docker compose ps -q "$service")"
              if [ -z "$id" ]; then
                all_healthy=0
                continue
              fi
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$id")"
              if [ "$health" != "healthy" ]; then all_healthy=0; fi
            done
            if [ "$all_healthy" -eq 1 ] && curl --fail http://localhost:8080/ready; then
              docker compose ps
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1
      - name: Verify the frontend actually serves before browser acceptance
        run: |
          # CI-H2: the service-healthy condition above (and the API's /ready
          # through Caddy) proves service liveness, not that the Next frontend
          # can serve. Caddy starts once web is merely STARTED, so browser steps
          # could reach a frontend that is not yet accepting requests and report
          # "expected element absent".
          #
          # This is a state-based readiness wait on a real served document, not a
          # blind sleep: it polls the actual frontend response and fails closed
          # with the web container logs if the frontend never serves.
          served=0
          for i in $(seq 1 90); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)"
            if [ "$code" = "200" ]; then served=1; break; fi
            sleep 2
          done
          if [ "$served" != "1" ]; then
            echo "Frontend did not serve http://localhost:8080/ with 200" >&2
            docker compose logs web
            exit 1
          fi
          echo "Frontend is serving HTTP 200 before browser acceptance"
      - name: Verify deployed monitoring endpoint
        run: |
          token="$(sed -n 's/^METRICS_BEARER_TOKEN=//p' .env)"
          test -n "$token"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8080/metrics)" = "401"
          curl --fail -H "Authorization: Bearer $token" http://localhost:8080/metrics > /tmp/workspace-metrics.txt
          grep -F 'workspace_dependency_ready{dependency="database"} 1' /tmp/workspace-metrics.txt
          grep -F 'workspace_dependency_ready{dependency="storage"} 1' /tmp/workspace-metrics.txt
          grep -F 'workspace_dependency_ready{dependency="antivirus"} 1' /tmp/workspace-metrics.txt
          grep -F 'workspace_service_healthy{service="collaboration"} 1' /tmp/workspace-metrics.txt
          grep -F 'workspace_service_healthy{service="worker"} 1' /tmp/workspace-metrics.txt
          grep -F 'workspace_http_requests_total' /tmp/workspace-metrics.txt
          ! grep -E 'tenant_id|user_id|resource_id|document_id' /tmp/workspace-metrics.txt
      - name: Verify live malware scanner detects EICAR
        run: |
          docker compose exec -T api node --import tsx --input-type=module <<'NODE'
          import { createAntivirus } from "./packages/security/antivirus.ts";
          const antivirus = createAntivirus(process.env);
          await antivirus.health();
          const clean = await antivirus.scan(Buffer.from("OpenJM Workspace clean antivirus acceptance payload"));
          if (clean.status !== "clean")
            throw new Error("Clean antivirus acceptance payload was not clean");
          const eicar = Buffer.from(
            [
              "X5O!P%@AP[4\\PZX54(P^)7CC)7}$EI",
              "CAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*",
            ].join(""),
          );
          const infected = await antivirus.scan(eicar);
          if (infected.status !== "infected")
            throw new Error("EICAR was not detected by the deployed malware scanner");
          if (!/Eicar/i.test(infected.signature))
            throw new Error("Unexpected EICAR signature: " + infected.signature);
          console.log("Malware scanner acceptance passed:", infected.signature);
          NODE
      # Wave X X2 runs FIRST among browser steps, immediately after the stack is
      # verified healthy and before any test creates or mutates Workspace
      # resources. The snapshot surfaces render workspace-wide state (sidebar
      # resource tree, recently viewed, page chrome), so their baselines are only
      # reproducible against a pristine seeded workspace. Running this later
      # produced 0.02-0.05 content differences no matter how exact the baselines.
      # It is also the first authenticated step, so the sign-in budget is
      # untouched.
      - name: Regenerate visual baselines (manual dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines
        env:
          E2E_BASE_URL: http://localhost:8080
        run: |
          export E2E_SETUP_TOKEN="$(sed -n 's/^SETUP_TOKEN=//p' .env)"
          # Explicit, human-triggered baseline update. A normal CI run never
          # updates baselines; the regenerated files are uploaded for review and
          # commit (see docs/VISUAL_REGRESSION.md). The canary is excluded so it
          # cannot overwrite a real baseline.
          npx playwright test --config=playwright.visual.config.ts --grep-invert "@canary" --update-snapshots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines
        with:
          name: visual-baselines
          path: e2e/visual.spec.ts-snapshots
      - name: Verify visual regression against committed baselines
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines) }}
        env:
          E2E_BASE_URL: http://localhost:8080
        run: |
          export E2E_SETUP_TOKEN="$(sed -n 's/^SETUP_TOKEN=//p' .env)"
          # Chromium-only deterministic snapshots (light/dark x desktop/phone).
          # Baselines are committed artefacts and CI NEVER updates them. Only
          # Chromium is used; cross-engine pixel baselines are deliberately not
          # maintained. Tolerance (0.002) is deliberately unchanged.
          npx playwright test --config=playwright.visual.config.ts --grep-invert "@canary"
          # Prove the harness detects intentional visual drift: the canary MUST
          # fail. A passing canary means the comparison is not actually running.
          if npx playwright test --config=playwright.visual.config.ts --grep "@canary"; then
            echo "Visual canary did NOT detect intentional drift" >&2
            exit 1
          else
            echo "Visual canary correctly detected intentional drift"
          fi
      - name: Verify deployed browser workflow
        run: node scripts/test-deployment.mjs
      - name: Verify Wave R fault-injection harness
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_WAVE_R_HARNESS: "1"
        run: |
          export E2E_SETUP_TOKEN="$(sed -n 's/^SETUP_TOKEN=//p' .env)"
          # Reuse the already-running production-like Compose stack. This
          # dedicated test may restart only the collaboration service and must
          # prove it reacquires health before continuing.
          npx playwright test e2e/wave-r-harness.spec.ts
      - name: Wait for auth rate-limit budget before W24-R
        run: |
          # The deployed browser workflow just ran Chromium, Firefox and WebKit
          # across three viewports against the same Caddy inbound IP, so the
          # sign-in route's strict production budget can already be exhausted
          # when W24-R starts. Adapt CI sequencing to the limiter instead of
          # weakening or bypassing it.
          bash scripts/ci/wait-for-auth-budget.sh
      - name: Qualify W24-R collaboration capacity
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_W24_CAPACITY: "1"
        run: |
          export E2E_SETUP_TOKEN="$(sed -n 's/^SETUP_TOKEN=//p' .env)"
          # Measured CI-host evidence only: 1/5/10/25 simultaneous editors,
          # real collaboration writer restart, reconnect latency, Docker
          # CPU/RSS, PostgreSQL activity/locks and collab health.
          npx playwright test e2e/wave-r-capacity.spec.ts
      - name: Verify application antivirus scan counters
        run: |
          token="$(sed -n 's/^METRICS_BEARER_TOKEN=//p' .env)"
          curl --fail -H "Authorization: Bearer $token" http://localhost:8080/metrics > /tmp/workspace-antivirus-metrics.txt
          grep -E 'workspace_antivirus_scans_total\{result="clean"\} [1-9][0-9]*$' /tmp/workspace-antivirus-metrics.txt
          grep -E 'workspace_antivirus_scans_total\{result="infected"\} [1-9][0-9]*$' /tmp/workspace-antivirus-metrics.txt
          grep -E 'workspace_antivirus_scans_total\{result="error"\} [0-9]+$' /tmp/workspace-antivirus-metrics.txt
          ! grep -E 'tenant_id|user_id|resource_id|document_id' /tmp/workspace-antivirus-metrics.txt
      - name: Verify deployed local attachment ciphertext
        run: |
          docker compose exec -T api node --input-type=module -e '
            import { readdir, readFile } from "node:fs/promises";
            import { join } from "node:path";
            const files = [];
            async function walk(root) {
              for (const entry of await readdir(root, { withFileTypes: true })) {
                const path = join(root, entry.name);
                if (entry.isDirectory()) await walk(path);
                else if (entry.isFile()) files.push(path);
              }
            }
            await walk("/data/files");
            if (!files.length) throw new Error("No deployed attachment objects found");
            for (const path of files) {
              const bytes = await readFile(path);
              if (bytes.subarray(0, 8).toString("hex") !== "4f4a534501a55aa5")
                throw new Error("Plaintext or unknown attachment envelope: " + path);
            }
            console.log("Verified encrypted attachment envelopes:", files.length);
          '
      - name: Verify isolated deployed restore drill
        run: |
          # Runs after the deployed counter and ciphertext checks: the drill's
          # explicit backup maintenance boundary stops and restarts api, collab
          # and worker, and workspace_antivirus_scans_total is reported since
          # process start, so restarting the API would reset the counters that
          # the preceding step asserts.
          bash scripts/ci-restore-drill.sh
      - name: Replenish browser rate-limit window without changing policy
        run: |
          # Chromium/Firefox and preceding deployed workflows share Caddy's
          # inbound IP in CI. Reuse the shared helper so every qualification
          # that needs a fresh authenticated session waits for real
          # response-header budget recovery and the server's own sign-in retry
          # hint. The API's production rate limiting remains enabled and
          # unchanged.
          bash scripts/ci/wait-for-auth-budget.sh
      - name: Qualify W24 whole-stack capacity
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_W24_WHOLE_STACK: "1"
        run: |
          export E2E_SETUP_TOKEN="$(sed -n 's/^SETUP_TOKEN=//p' .env)"
          # Runs immediately after the replenished shared rate-limit window and
          # before the stack is reconfigured for TLS, because the sign-in route
          # keeps its own strict production budget that the preceding browser
          # workflows exhaust. Measured CI-host evidence only: 1/5/10/25
          # concurrent sessions over the mixed read/write workload, capturing
          # host characteristics, container CPU/RSS, PostgreSQL connections and
          # lock pressure, worker and queue backlog. Writes
          # capacity-results/w24-reference-host.json.
          npx playwright test e2e/w24-capacity.spec.ts
      - name: Wait for auth rate-limit budget before accessibility matrix
        run: |
          # Runs after the W24 whole-stack load and authenticates across nine
          # engine x viewport projects on the shared inbound IP, so it reuses the
          # same helper rather than assuming leftover sign-in budget.
          bash scripts/ci/wait-for-auth-budget.sh
      - name: Verify keyboard accessibility across engines and viewports
        run: |
          # Wave X X1: Chromium, Firefox and WebKit x desktop/tablet/phone.
          # Linux WebKit is an engine-compatibility proxy, not Safari on
          # macOS/iOS. No assertion is removed and no gate is lowered to pass an
          # engine.
          E2E_BASE_URL=http://localhost:8080           E2E_SETUP_TOKEN="$(sed -n 's/^SETUP_TOKEN=//p' .env)"           npx playwright test --config=playwright.compat.config.ts
      - name: Verify deterministic engine and viewport harness
        env:
          E2E_BASE_URL: http://localhost:8080
        run: |
          export E2E_SETUP_TOKEN="$(sed -n 's/^SETUP_TOKEN=//p' .env)"
          # Wave X X0: named engine x viewport projects (chromium/firefox/webkit
          # x desktop/tablet/phone) over the deterministic synthetic fixture,
          # then a repeated-run determinism proof on one project. Linux WebKit is
          # an engine-compatibility proxy, NOT a claim of Safari on macOS or iOS.
          # Runs after the replenished sign-in budget because it authenticates.
          npx playwright test --config=playwright.harness.config.ts
          node scripts/e2e-determinism.mjs
      - name: Verify trusted HTTPS, secure cookies and WSS
        run: |
          docker compose down
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const path = ".env";
          let lines = readFileSync(path, "utf8").trimEnd().split("\n");
          const values = {
            APP_URL: "https://workspace.test",
            CADDY_ADDRESS: "workspace.test",
            CADDY_TLS_DIRECTIVE: "tls internal",
            BIND_ADDRESS: "127.0.0.1",
            HTTP_PORT: "80",
            HTTPS_PORT: "443",
            COOKIE_SECURE: "true",
          };
          for (const [key, value] of Object.entries(values)) {
            const i = lines.findIndex((line) => line.startsWith(`${key}=`));
            const next = `${key}=${value}`;
            if (i >= 0) lines[i] = next;
            else lines.push(next);
          }
          writeFileSync(path, lines.join("\n") + "\n");
          NODE
          echo "127.0.0.1 workspace.test" | sudo tee -a /etc/hosts
          docker compose up -d
          for i in $(seq 1 120); do
            all_healthy=1
            for service in api collab worker clamav; do
              id="$(docker compose ps -q "$service")"
              if [ -z "$id" ]; then all_healthy=0; continue; fi
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$id")"
              if [ "$health" != "healthy" ]; then all_healthy=0; fi
            done
            # `web` declares no healthcheck and starts after the API reports
            # healthy, so it must be required to be running explicitly or the
            # browser can be launched against a half-started front end.
            web_id="$(docker compose ps -q web)"
            if [ -z "$web_id" ] || \
               [ "$(docker inspect --format '{{.State.Status}}' "$web_id")" != "running" ]; then
              all_healthy=0
            fi
            caddy_id="$(docker compose ps -q caddy)"
            if [ "$all_healthy" -eq 1 ] && [ -n "$caddy_id" ]; then break; fi
            sleep 2
          done
          caddy_id="$(docker compose ps -q caddy)"
          for i in $(seq 1 30); do
            if docker cp "$caddy_id:/data/caddy/pki/authorities/local/root.crt" /tmp/openjm-workspace-root.crt 2>/dev/null; then break; fi
            sleep 1
          done
          test -s /tmp/openjm-workspace-root.crt
          sudo cp /tmp/openjm-workspace-root.crt /usr/local/share/ca-certificates/openjm-workspace-ci.crt
          sudo update-ca-certificates
          if ! command -v certutil >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libnss3-tools
          fi
          mkdir -p "$HOME/.pki/nssdb"
          if [ ! -f "$HOME/.pki/nssdb/cert9.db" ]; then
            certutil -d "sql:$HOME/.pki/nssdb" -N --empty-password
          fi
          certutil -d "sql:$HOME/.pki/nssdb" -D -n "OpenJM Workspace CI" >/dev/null 2>&1 || true
          certutil -d "sql:$HOME/.pki/nssdb" -A -t "C,," -n "OpenJM Workspace CI" -i /tmp/openjm-workspace-root.crt
          curl --fail --cacert /tmp/openjm-workspace-root.crt https://workspace.test/ready
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://workspace.test/ready)" = "308"
          # Chromium aborts an in-flight navigation with ERR_NETWORK_CHANGED
          # when the host's interfaces change mid-request. Docker keeps
          # creating container interfaces for a moment after every service
          # reports ready, so let that settle before launching a browser.
          sleep 5
          NODE_EXTRA_CA_CERTS=/tmp/openjm-workspace-root.crt \
            E2E_BASE_URL=https://workspace.test \
            E2E_SETUP_TOKEN="$(sed -n 's/^SETUP_TOKEN=//p' .env)" \
            npx playwright test e2e/tls.spec.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-results
          path: |
            playwright-report
            test-results
            capacity-results
            docs/screenshots
      - name: Deployment logs
        if: failure() && hashFiles('.env') != ''
        run: docker compose logs --tail=100
      - name: Stop deployment
        if: always() && hashFiles('.env') != ''
        run: docker compose down

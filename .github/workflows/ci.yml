name: Workspace verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: workspace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      seaweedfs:
        image: chrislusf/seaweedfs:4.47
        env:
          AWS_ACCESS_KEY_ID: workspace-ci
          AWS_SECRET_ACCESS_KEY: workspace-ci-secret
          S3_BUCKET: workspace-ci
        ports: ["8333:8333"]
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: workspace
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:test-only-password@localhost:5432/workspace
      TEST_S3_ENDPOINT: http://127.0.0.1:8333
      TEST_S3_ACCESS_KEY: workspace-ci
      TEST_S3_SECRET_KEY: workspace-ci-secret
      NEXT_TELEMETRY_DISABLED: "1"
      TEST_SHUTDOWN_DIAGNOSTICS: "true"
      PGOPTIONS: "-c statement_timeout=30000 -c lock_timeout=10000"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        timeout-minutes: 3
      - run: npm run build
  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Validate deployment configuration
        run: |
          node scripts/init-env.mjs
          docker compose config --quiet
      - name: Build application container
        run: docker compose build api
      - name: Start deployment
        run: |
          docker compose up -d
          for i in $(seq 1 60); do
            all_healthy=1
            for service in api collab worker; do
              id="$(docker compose ps -q "$service")"
              if [ -z "$id" ]; then
                all_healthy=0
                continue
              fi
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$id")"
              if [ "$health" != "healthy" ]; then all_healthy=0; fi
            done
            if [ "$all_healthy" -eq 1 ] && curl --fail http://localhost:8080/ready; then
              docker compose ps
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1
      - name: Verify deployed browser workflow
        run: node scripts/test-deployment.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-results
          path: |
            playwright-report
            test-results
            docs/screenshots
      - name: Deployment logs
        if: failure() && hashFiles('.env') != ''
        run: docker compose logs --tail=100
      - name: Stop deployment
        if: always() && hashFiles('.env') != ''
        run: docker compose down

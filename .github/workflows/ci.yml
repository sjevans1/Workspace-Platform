name: Workspace verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: workspace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: workspace
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:test-only-password@localhost:5432/workspace
      NEXT_TELEMETRY_DISABLED: "1"
      TEST_SHUTDOWN_DIAGNOSTICS: "true"
      PGOPTIONS: "-c statement_timeout=30000 -c lock_timeout=10000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        timeout-minutes: 3
      - run: npm run build
  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Validate deployment configuration
        run: |
          node scripts/init-env.mjs
          docker compose config --quiet
      - name: Build application container
        run: docker compose build api
      - name: Start deployment
        run: |
          docker compose up -d
          for i in $(seq 1 60); do
            if curl --fail http://localhost:8080/ready; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Verify deployed browser workflow
        run: node scripts/test-deployment.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-results
          path: |
            playwright-report
            test-results
            docs/screenshots
      - name: Deployment logs
        if: failure() && hashFiles('.env') != ''
        run: docker compose logs --tail=100
      - name: Stop deployment
        if: always() && hashFiles('.env') != ''
        run: docker compose down
